# Example imapsync-go configuration.
#
# Credentials are always referenced indirectly. Passwords are never written
# here: use an environment variable, a file, or the macOS keychain. Servers
# that no longer accept passwords at all -- Microsoft 365 since April 2026,
# and Gmail unless the account has an app password -- authenticate with an
# OAuth token instead; see the third pair below.
#
#   imapsync-go probe --config imapsync.example.yaml --pair icloud-to-mox --side both

pairs:
  - name: icloud-to-mox

    source:
      # iCloud requires an app-specific password, not the account password.
      # The username may be written plainly; no percent-encoding needed.
      url: "imaps://you@icloud.com@imap.mail.me.com:993"
      password:
        env: ICLOUD_APP_PW

    dest:
      url: "imaps://you@mox.example.net:993"
      password:
        keychain: mox-imap

    concurrency:
      # "auto" opens 16 to each side. The governor narrows the pool when the
      # server refuses and climbs back, one connection at a time, while it does
      # not — but it never climbs past the number set here, so 16 is a ceiling
      # rather than a target.
      #
      # For a real migration, measure it instead:
      #     imapsync-go probe --url imaps://you@imap.mail.me.com
      # and put the number it reports here. Measured ceilings so far: iCloud
      # 48 or more, mox 30. Leave headroom for your own mail clients.
      source: auto
      dest: auto
      # Total bytes of in-flight message data. Backpressure is measured in
      # bytes rather than message count so a handful of large attachments
      # cannot exhaust memory.
      max_inflight: 512MiB
      # The brake. One allowance shared by the whole run, not one per
      # connection, so the number means the same at any width. Omit either for
      # no limit. A message is charged once and crosses the wire twice, so
      # 1MiB/second here is about 2MiB/second of real traffic.
      #max_bytes_per_second: 1MiB
      #max_messages_per_second: 10

    folders:
      # How source folders find their destination. Two modes:
      #   special-use  resolve Sent/Trash/Drafts/Junk/Archive by their
      #                SPECIAL-USE attribute before falling back to the name,
      #                so iCloud's "Sent Messages" maps onto mox's "Sent"
      #                without hand-written rules.
      #   name         name translation only. The hierarchy delimiter is still
      #                converted, so "a/b" reaches a dot-separated server as
      #                "a.b".
      map: special-use
      exclude:
        - "Notes"
      # Explicit overrides, applied last.
      rules: []

    # Destructive operations are opt-in. Even when enabled, a run that would
    # delete an unusually large share of a folder aborts unless forced.
    delete2: false

  # A directory on disk is a valid endpoint on either side, so the same pair
  # syntax backs an account up and puts it back again. There is no separate
  # backup command and no separate format: file:// is an IMAP server that
  # happens to be a folder of .eml files.
  - name: mox-to-disk

    source:
      url: "imaps://jens@hilli.dk@mox-archive.hilli.dk:993"
      password:
        keychain: mox-imap

    dest:
      # Everything after file:// is the path, taken literally and not
      # percent-decoded, so a folder really can be called "Rejsen 50%". A
      # leading ~ is expanded here, because no shell will see this file.
      url: "file://~/Mail-backup"
      # No password: a directory does not have one, and writing one here is an
      # error rather than something quietly ignored.

    concurrency:
      source: 24
      # The destination is a disk. The limit is fsync and SQLite rather than a
      # server's patience, and past about 16 the writers mostly wait on each
      # other.
      dest: 16

    # The reverse pair restores it: swap source and dest. Any server will do —
    # the backup is not tied to the one it came from.

  # A pair whose destination no longer accepts a password. Microsoft retired
  # IMAP basic authentication for Exchange Online in April 2026, so an OAuth
  # token is the only way in.
  - name: icloud-to-office365

    source:
      url: "imaps://you@icloud.com@imap.mail.me.com:993"
      password:
        env: ICLOUD_APP_PW

    dest:
      url: "imaps://you@example.onmicrosoft.com@outlook.office365.com:993"
      # An access token, not a password: it is sent with XOAUTH2 rather than
      # LOGIN. A password and an oauth block together are refused rather than
      # resolved by precedence, because both would authenticate and you would
      # never learn which one the server saw.
      oauth:
        # Exactly one of refresh, command or file.
        #
        # refresh is the usual one: the credential written by
        #
        #   imapsync-go oauth login --client-id ... --keychain office365
        #
        # which this tool exchanges for access tokens itself, minting a new
        # one whenever the server refuses the one it holds. A migration
        # outlives an access token -- an hour is typical -- so this is what
        # makes an overnight run possible at all.
        #
        # It is a Secret like a password, so it can come from the keychain,
        # a file or the environment. Name it per endpoint rather than per
        # provider: two mailboxes on the same provider are two credentials.
        refresh:
          keychain: office365

        # Bounds the token request, or a command that hangs waiting for input
        # it will never get. Defaults to 30s.
        timeout: 30s

        # command runs on demand and re-runs on a refusal, for a refresher you
        # already have. Whatever it prints is the token; trailing whitespace is
        # trimmed. Note that neither cloud CLI can do this: an `az account
        # get-access-token` token carries user_impersonation rather than
        # IMAP.AccessAsUser.All, and Exchange refuses it.
        #   command: ~/bin/office365-token

        # file is for a token some other process maintains. It is re-read on a
        # refusal, so an external refresher can replace it mid-run.
        #   file: ~/.config/imapsync-go/office365.token

    concurrency:
      source: 40
      dest: 8
